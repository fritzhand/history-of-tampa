<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Open Civic Archive">
  <title>Open Civic Archive — Downtown Tampa</title>
  <!-- The Hillsborough River bending into the bay, the downtown street grid on
       its east bank, and a Plant minaret on the west. -->
  <rect width="32" height="32" rx="6" fill="#14120E"/>
  <path d="M9 1.5 C 7.5 9, 8 15, 11.5 21 C 14 25.5, 19 28.5, 30.5 28.5"
        stroke="#7FA8CF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <g fill="#8C867C">
    <rect x="15.5" y="5.5" width="4.5" height="4.5" rx=".9"/>
    <rect x="21"   y="5.5" width="4.5" height="4.5" rx=".9"/>
    <rect x="26.5" y="5.5" width="4.5" height="4.5" rx=".9"/>
  </g>
  <g fill="#CBB68A">
    <rect x="15.5" y="11" width="4.5" height="4.5" rx=".9"/>
    <rect x="21"   y="11" width="4.5" height="4.5" rx=".9"/>
    <rect x="26.5" y="11" width="4.5" height="4.5" rx=".9"/>
  </g>
  <g fill="#D9A96B">
    <rect x="15.5" y="16.5" width="4.5" height="4.5" rx=".9"/>
    <rect x="21"   y="16.5" width="4.5" height="4.5" rx=".9"/>
    <rect x="26.5" y="16.5" width="4.5" height="4.5" rx=".9"/>
  </g>
  <rect x="2.8" y="8" width="2.8" height="11" rx=".7" fill="#E06A5E"/>
  <circle cx="4.2" cy="6.4" r="2.3" fill="#E06A5E"/>
</svg>
